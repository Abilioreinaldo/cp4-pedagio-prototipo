<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CP4 Logtech · Área da transportadora</title>
<meta name="description" content="Protótipo navegável da área logada da transportadora na CP4. Dados de demonstração.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: menu lateral fixo + área de conteúdo centralizada, no visual escuro do produto */
:root{
  --bg:#09090b; --side:#18181a; --card:#141416; --card2:#1c1c1f; --line:#2a2a2e; --line2:#222226;
  --fg:#eceef0; --muted:#9a9ca3; --faint:#6c6e75;
  --accent:#34c79a; --accent-bg:#123a2f;
  --blue:#4c8dff; --blue-bg:#16233d; --orange:#f5a524; --orange-bg:#3a2a10;
  --purple:#9b7bff; --purple-bg:#271f44; --red:#f2665b; --red-bg:#3a1714;
  --font:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:13px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.demo{background:var(--orange-bg);color:var(--orange);border:1px solid #5a4214;border-radius:6px;padding:6px 8px;font-size:10px;font-weight:600;text-align:center}
.demo-m{display:none}

/* ---------- Estrutura ---------- */
.app{display:flex;min-height:100%}
.side{width:207px;flex-shrink:0;background:var(--side);display:flex;flex-direction:column;gap:18px;padding:8px 6px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .top{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.side .top img{height:34px;width:auto;display:block}
.icon-btn{background:none;border:0;color:var(--muted);padding:6px;border-radius:6px;display:grid;place-items:center}
.icon-btn:hover{background:var(--card2);color:var(--fg)}
.company{position:relative}
.company>button{width:100%;display:flex;align-items:center;gap:10px;background:var(--side);border:1px solid #3a3a3f;border-radius:6px;padding:14px 10px;text-align:left}
.company .sig{background:#0c0c0e;border-radius:4px;font-weight:700;font-size:11px;padding:3px 4px;flex-shrink:0}
.company .nm{flex:1;font-size:11px;font-weight:700;text-transform:uppercase;line-height:1.35}
.menu-pop{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:4px;z-index:20;box-shadow:0 12px 30px #0008}
.menu-pop button{width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px;font-size:12px}
.menu-pop button:hover{background:#26262a}
nav.menu{display:flex;flex-direction:column;gap:3px}
nav.menu a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;color:#d7d9dc;text-decoration:none;font-size:11px;font-weight:500}
nav.menu a svg{color:var(--muted);flex-shrink:0}
nav.menu a:hover{background:#202024}
nav.menu a.on{background:#232327;color:var(--accent)}
nav.menu a.on svg{color:var(--accent)}
.side .demo{margin-top:auto}
.side .me{border-top:1px solid var(--line);padding:14px 6px 0;display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:11px;flex-shrink:0}
.me .who{flex:1;min-width:0;font-size:11px}
.me .who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who span{color:var(--muted)}

.main{flex:1;min-width:0;padding:10px 24px 64px}
.wrap{max-width:812px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.mobbar{display:none}

h1{margin:0;font-size:20px;font-weight:700;text-wrap:balance}
h2{margin:6px 0 0;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
h2 svg{color:var(--muted)}
.titlebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.titlebar h1{flex:1}
.sub{color:var(--muted);font-size:12px;margin:-6px 0 0}

/* ---------- Componentes ---------- */
.card{background:var(--card);border:1px solid #333338;border-radius:6px}
.pad{padding:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{display:flex;align-items:center;gap:12px;padding:12px}
.ico{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;flex-shrink:0}
.ico.g{background:var(--accent-bg);color:var(--accent)} .ico.o{background:var(--orange-bg);color:var(--orange)}
.ico.b{background:var(--blue-bg);color:var(--blue)} .ico.p{background:var(--purple-bg);color:var(--purple)}
.ico.r{background:var(--red-bg);color:var(--red)}
.stat{min-width:0}
.stat .v{font-size:16px;font-weight:700;line-height:1.2}
.stat .l{font-size:10px;color:var(--muted)}
.metric{padding:18px 16px;display:flex;justify-content:space-between;gap:10px}
.metric .l{font-size:10px;color:var(--muted)}
.metric .v{font-size:19px;font-weight:700;margin-top:4px}
.metric .h{font-size:10px;color:var(--faint);margin-top:4px}
.bar{height:5px;border-radius:9px;background:#3a3a3f;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}

.btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid #3a3a3f;border-radius:6px;padding:7px 11px;font-size:11px;font-weight:500;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--card2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#06221a;font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 9px;font-size:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;font-weight:600}
.field .hint{font-size:10px;color:var(--muted)}
.input,select.input{background:#101012;border:1px solid #3a3a3f;border-radius:6px;padding:8px 10px;font-size:12px;width:100%;min-width:0}
.input:focus{border-color:var(--accent);outline:none}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid #3a3a3f;border-radius:6px;overflow:hidden}
.seg button{background:#101012;border:0;padding:7px 11px;font-size:11px;color:var(--muted)}
.seg button+button{border-left:1px solid #3a3a3f}
.seg button.on{background:#232327;color:var(--fg);font-weight:600}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.g{background:var(--accent-bg);color:var(--accent)} .pill.b{background:var(--blue-bg);color:var(--blue)}
.pill.o{background:var(--orange-bg);color:var(--orange)} .pill.r{background:var(--red-bg);color:var(--red)}
.pill.n{background:#26262a;color:var(--muted)}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#19191c}
.r{text-align:right}
.muted{color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.tag{display:inline-block;font-weight:700;letter-spacing:.04em;background:#0e0e10;border:1px solid #3a3a3f;border-radius:4px;padding:1px 6px}

/* Gráficos e mapa */
.chart-card{padding:18px 16px 14px}
.chart-card h3{margin:0 0 6px;font-size:11px;font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:9px;margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.map{position:relative;overflow:hidden;border-radius:6px}
.map svg{display:block;width:100%;height:auto}
.map .pin{cursor:pointer}
.map .pin:hover rect,.map .pin.on rect{fill:#4fe0b1}
.posto-card{position:absolute;left:12px;bottom:12px;max-width:260px;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 12px 30px #0009}
.posto-card b{font-size:12px}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:12px;font-weight:600}
.li .t span{font-size:10px;color:var(--muted)}

/* Modal, gaveta e aviso */
.scrim{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:16px}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--card);border:1px solid #3a3a3f;border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h3{margin:0;font-size:15px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.sumbox{background:#101012;border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:11px}
.sumbox .tot{font-weight:700;font-size:13px}
.err{color:var(--red);font-size:11px}
.token{font-size:30px;font-weight:800;letter-spacing:.3em;text-align:center;padding:14px;background:#101012;border:1px dashed var(--accent);border-radius:8px;color:var(--accent)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--card);border-left:1px solid #3a3a3f;z-index:51;padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:11px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:600}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;background:#101012;border:1px solid var(--line);border-radius:6px;padding:10px;word-break:break-all}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#e9f8f2;color:#06221a;font-weight:600;font-size:12px;padding:10px 16px;border-radius:8px;z-index:60;box-shadow:0 10px 30px #000a}


/* Conta corrente, tabelas e seleção de postos */
.crumb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.hero-conta{position:relative;overflow:hidden;border-radius:8px;padding:18px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,#0f6b58 0%,#17917a 60%,#1fa58b 100%);color:#fff}
.hero-conta::after{content:"";position:absolute;right:-40px;top:-60px;width:170px;height:170px;border-radius:50%;background:#ffffff14}
.hero-conta .l{font-size:11px;color:#d8f5ec}
.hero-conta .big{font-size:24px;font-weight:700;margin-top:2px}
.hero-kpis{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.hero-kpis div{border:1px solid #ffffff55;background:#ffffff14;border-radius:6px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;min-width:0}
.hero-kpis span{font-size:9px;letter-spacing:.04em;color:#d8f5ec}
.hero-kpis b{font-size:12px}
.btn.blue{background:#2f6fe4;border-color:#2f6fe4;color:#fff;font-weight:600}
.btn.blue:hover{filter:brightness(1.1)}
.tbl-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
td.ell{max-width:230px;overflow:hidden;text-overflow:ellipsis}
.checks{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:4px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:6px;font-size:11px;cursor:pointer}
.chk:hover{background:#1c1c1f}
.chk input{margin-top:2px;accent-color:var(--accent)}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(900px 500px at 70% -10%,#12352b 0,transparent 60%),var(--bg)}
.login form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
.login img{height:52px;width:auto;align-self:flex-start;margin-bottom:6px}

/* ---------- Celular ---------- */
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;z-index:45;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px #000c}
  .app.open .side{transform:none}
  .app.open::after{content:"";position:fixed;inset:0;background:#0008;z-index:44}
  .mobbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--side);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));margin:-10px -16px 12px}
  .mobbar img{height:28px}
  .mobbar .co{margin-left:auto;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);text-align:right}
  .main{padding:10px 16px 72px}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .demo-m{display:block;margin:-4px 0 12px}
  .stat{padding:10px;gap:8px}
  .stat .v{font-size:14px;overflow-wrap:anywhere}
  .li{flex-wrap:wrap}
  .li .t{flex-basis:calc(100% - 44px)}
  .li .t b{white-space:normal}
  .posto-card{position:static;max-width:none;border-radius:0;border-width:1px 0 0}
}
</style>
</head>

function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

function tabela(nome, dados, colunas, linha, botao){
  var q = (S.q[nome] || '').toLowerCase(), pg = S.pg[nome] || 0, porPag = 10;
  var f = dados.filter(function(d){ return !q || JSON.stringify(d).toLowerCase().indexOf(q) >= 0; });
  var pags = Math.max(1, Math.ceil(f.length / porPag)); if (pg >= pags) pg = pags - 1;
  var vis = f.slice(pg*porPag, pg*porPag + porPag);
  return '<div class="card"><div class="tbl-top">'+botao+'<div style="position:relative;flex:1;min-width:180px;max-width:280px;margin-left:auto"><span style="position:absolute;left:9px;top:8px;color:var(--muted)">'+ic('search',13)+'</span><input class="input" id="busca-'+nome+'" data-busca="'+nome+'" placeholder="Pesquisar" value="'+esc(S.q[nome]||'')+'" style="padding-left:30px" aria-label="Pesquisar"></div></div>' +
  '<div class="tbl-wrap"><table><thead><tr>'+colunas.map(function(c){ return '<th'+(c[1]?' class="r"':'')+'>'+c[0]+'</th>'; }).join('')+'</tr></thead><tbody>' +
  (vis.length ? vis.map(linha).join('') : '<tr><td colspan="'+colunas.length+'" class="empty">'+(q ? 'Nada encontrado para “'+esc(S.q[nome])+'”.' : 'Nenhum registro no período.')+'</td></tr>') +
  '</tbody></table></div><div class="pager"><span>'+n0(f.length)+' registro'+(f.length===1?'':'s')+'</span><span style="display:flex;gap:6px;align-items:center"><button class="btn sm" data-pg="'+nome+'" data-dir="-1" '+(pg===0?'disabled':'')+'>Anterior</button><span class="num">'+(pg+1)+' / '+pags+'</span><button class="btn sm" data-pg="'+nome+'" data-dir="1" '+(pg>=pags-1?'disabled':'')+'>Próxima</button></span></div></div>';
}

var root = document.getElementById('root');
function render(){
  if (!S.logado) { root.innerHTML = login(); return; }
  var r = rota(), e = emp();
  var tela = {dashboard:telaDashboard, faturamento:telaFaturamento, certificado:telaCertificado, conta:telaConta, relatorios:telaRelatorios, motoristas:telaMotoristas, veiculos:telaVeiculos, usuarios:telaUsuarios}[r]();
  var foco = document.activeElement && document.activeElement.id, pos = foco && document.activeElement.selectionStart;
  root.innerHTML =
  '<div class="app'+(S.menuAberto?' open':'')+'">' +
    '<aside class="side" aria-label="Menu"><div class="top"><img src="logo.png" alt="CP4 Logtech" width="66" height="34"><button class="icon-btn" data-act="menu" aria-label="Recolher menu">'+ic('left',14)+'</button></div>' +
    '<div class="company"><button data-act="empresas" aria-expanded="'+(!!S.empAberto)+'"><span class="sig">'+esc(e.sig)+'</span><span class="nm">'+esc(e.nome)+'</span>'+ic('chev',12)+'</button>' +
      (S.empAberto ? '<div class="menu-pop">'+EMPRESAS.map(function(x,i){ return '<button data-emp="'+i+'">'+esc(x.nome)+'<br><span class="muted num">'+x.cnpj+'</span></button>'; }).join('')+'</div>' : '') + '</div>' +
    '<nav class="menu">' + ROTAS.map(function(x){ return '<a href="#'+x[0]+'" class="'+(r===x[0]?'on':'')+'"'+(r===x[0]?' aria-current="page"':'')+'>'+ic(x[2],14)+x[1]+'</a>'; }).join('') + '</nav>' +
    '<div class="demo">Dados de demonstração</div><div class="me">'+avatar('Renata Moreira',30)+'<div class="who"><b>Renata Moreira</b><span>Administrador</span></div><button class="icon-btn" data-act="sair" aria-label="Sair" title="Sair">'+ic('out',14)+'</button></div></aside>' +
    '<main class="main"><div class="mobbar"><button class="icon-btn" data-act="menu" aria-label="Abrir menu">'+ic('menu',18)+'</button><img src="logo.png" alt="CP4 Logtech" width="54" height="28"><span class="co">'+esc(e.nome)+'</span></div><div class="demo demo-m">Dados de demonstração</div><div class="wrap">'+tela+'</div></main>' +
  '</div>' +
  (S.modal ? (S.modal.tipo === 'fatura' ? '<div class="scrim" data-act="fecha" style="place-items:end"></div>' + gavetaFatura() : '<div class="scrim" data-scrim="1">' + (S.modal.tipo === 'postos' ? modalPostos() : modalSimples(S.modal.tipo)) + '</div>') : '');
  if (foco) { var el = document.getElementById(foco); if (el) { el.focus(); try { if (pos != null) el.setSelectionRange(pos,pos); } catch(_){} } }
}
function login(){
  return '<div class="login"><form id="form-login"><img src="logo.png" alt="CP4 Logtech" width="101" height="52"><h1>Entrar na CP4</h1>' +
  '<div class="field"><label for="lg-email">E-mail</label><input class="input" id="lg-email" type="email" value="renata@'+esc(DOMINIO)+'"></div>' +
  '<div class="field"><label for="lg-senha">Senha</label><input class="input" id="lg-senha" type="password" value="demonstracao"></div>' +
  '<button class="btn pri" type="submit" style="justify-content:center;padding:10px">Entrar</button><p class="muted" style="font-size:11px;margin:0">Demonstração: clique em Entrar.</p></form></div>';
}

document.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-act],[data-emp],[data-posto],[data-fatura],[data-veiculo],[data-placa],[data-pg],[data-encerrar],[data-escopo],[data-scrim],nav.menu a');
  if (!t) { if (S.empAberto || (S.menuAberto && !ev.target.closest('.side'))) { S.empAberto = false; S.menuAberto = false; render(); } return; }
  if (t.matches('[data-scrim]') && ev.target !== t) return;
  if (t.matches('nav.menu a')) { S.menuAberto = false; S.empAberto = false; return; }
  var a = t.getAttribute('data-act');
  if (a === 'menu') { S.menuAberto = window.innerWidth <= 900 ? !S.menuAberto : false; }
  else if (a === 'empresas') { S.empAberto = !S.empAberto; }
  else if (a === 'fecha' || t.matches('[data-scrim]')) { S.modal = null; }
  else if (a === 'atualizar') { toast('Dados atualizados às ' + hora(new Date())); return; }
  else if (a === 'pdf' || a === 'pdf-nf') { toast(a === 'pdf' ? 'No painel real, o PDF da fatura é baixado aqui.' : 'No painel real, o pacote de XML é baixado aqui.'); return; }
  else if (a === 'fecha-posto') { S.postoSel = null; }
  else if (a === 'sair') { S.logado = false; S.modal = null; }
  else if (a && /^novo-|pedir-limite/.test(a)) { S.modal = { tipo:a }; }
  else if (t.hasAttribute('data-emp')) { S.emp = +t.getAttribute('data-emp'); S.empAberto = false; toast('Empresa alterada para ' + emp().nome); }
  else if (t.hasAttribute('data-posto')) { var i = +t.getAttribute('data-posto'); S.postoSel = S.postoSel === i ? null : i; }
  else if (t.hasAttribute('data-fatura')) { S.modal = { tipo:'fatura', id:t.getAttribute('data-fatura') }; }
  else if (t.hasAttribute('data-veiculo')) { var v = VEICULOS.filter(function(x){ return x.placa === t.getAttribute('data-veiculo'); })[0]; S.modal = { tipo:'postos', placa:v.placa, sel: v.postos ? v.postos.slice() : null }; }
  else if (t.hasAttribute('data-placa')) { S.rel.placa = t.getAttribute('data-placa'); S.pg.comp = 0; }
  else if (t.hasAttribute('data-escopo')) { S.modal.sel = t.getAttribute('data-escopo') === 'todos' ? null : (S.modal.sel || []); }
  else if (t.hasAttribute('data-encerrar')) { var s = SESSOES.splice(+t.getAttribute('data-encerrar'), 1)[0]; toast('Sessão de ' + s.quem + ' encerrada'); }
  else if (t.hasAttribute('data-pg')) { var n = t.getAttribute('data-pg'); S.pg[n] = (S.pg[n]||0) + (+t.getAttribute('data-dir')); }
  render();
});

document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape' && (S.modal || S.empAberto || S.menuAberto)) { S.modal = null; S.empAberto = false; S.menuAberto = false; render(); }
  if (ev.key === 'Enter' && ev.target.matches('[data-posto],[data-fatura],[data-veiculo]')) ev.target.click();
});
document.addEventListener('input', function(ev){
  var t = ev.target;
  if (t.hasAttribute('data-busca')) { S.q[t.getAttribute('data-busca')] = t.value; S.pg[t.getAttribute('data-busca')] = 0; render(); }
});
document.addEventListener('change', function(ev){
  var t = ev.target;
  if (t.hasAttribute('data-periodo')) { S.periodo = +t.value; render(); }
  else if (t.hasAttribute('data-relf')) { var k = t.getAttribute('data-relf'); S.rel[k] = k === 'periodo' ? +t.value : t.value; S.pg.comp = 0; render(); }
  else if (t.hasAttribute('data-chk')) { var i = +t.getAttribute('data-chk'), a = S.modal.sel, p = a.indexOf(i); if (t.checked && p < 0) a.push(i); if (!t.checked && p >= 0) a.splice(p, 1); }
});
document.addEventListener('submit', function(ev){
  ev.preventDefault();
  var f = ev.target;
  if (f.id === 'form-login') { S.logado = true; location.hash = 'dashboard'; render(); return; }
  if (f.id === 'form-cert') {
    var arq = document.getElementById('cert-arq').files[0], senha = document.getElementById('cert-senha').value, e = document.getElementById('cert-err');
    if (!arq || !senha) { e.textContent = !arq ? 'Escolha o arquivo .pfx ou .p12.' : 'Informe a senha do certificado.'; e.hidden = false; return; }
    S.cert.status = 'Em validação'; S.cert.envio = arq.name; render(); toast('Certificado enviado para validação'); return;
  }
  if (f.id === 'form-postos') {
    var v = VEICULOS.filter(function(x){ return x.placa === S.modal.placa; })[0];
    if (S.modal.sel && !S.modal.sel.length) { var er = document.getElementById('ps-err'); er.textContent = 'Marque pelo menos um posto ou escolha Toda a rede.'; er.hidden = false; return; }
    v.postos = S.modal.sel ? S.modal.sel.slice().sort(function(a,b){return a-b;}) : null;
    toast(v.placa + ': ' + (v.postos ? v.postos.length + ' posto' + (v.postos.length>1?'s':'') + ' permitido' + (v.postos.length>1?'s':'') : 'pode abastecer em toda a rede'));
    S.modal = null; render(); return;
  }
  if (f.id === 'form-simples') {
    var tipo = f.getAttribute('data-tipo'), d = {};
    f.querySelectorAll('[data-f]').forEach(function(x){ d[x.getAttribute('data-f')] = x.value.trim(); });
    if (tipo === 'novo-motorista') { MOTORISTAS.unshift({ nome:d.nome, cpf:d.cpf, tipo:d.tipo, saldo:0, criada:dia(HOJE), tel:d.tel, ativo:true }); S.q.mot = ''; S.pg.mot = 0; toast('Convite enviado para o WhatsApp de ' + d.nome.split(' ')[0]); }
    if (tipo === 'novo-veiculo') { VEICULOS.unshift({ placa:d.placa.toUpperCase().replace(/[^A-Z0-9]/g,''), modelo:d.modelo, tanque:+d.tanque, ano:2026, km:+d.km, renavam:d.renavam, postos:null, ativo:true }); S.q.vei = ''; S.pg.vei = 0; toast('Veículo cadastrado'); }
    if (tipo === 'novo-usuario') { USUARIOS.push({ nome:d.nome, email:d.email, funcao:d.funcao, dois:false, status:'Convite enviado', acesso:'—' }); toast('Convite enviado para ' + d.email); }
    if (tipo === 'pedir-limite') { toast('Solicitação enviada. A CP4 responde em até 1 dia útil.'); }
    S.modal = null; render();
  }
});
window.addEventListener('hashchange', function(){ S.menuAberto = false; window.scrollTo(0,0); render(); });
render();

</script>
</body>
</html>
