<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Radar de Preços CP4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell. Sidebar com troca de espaço (Comendador / CP4) no desktop; barra inferior no celular. Preços sempre no formato de totem de posto. */
:root{
  /* Marca CP4 Logtech: fundo petróleo, limão como único realce de interação, verde só para status. */
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E7EDEA; --ink:#0B1D20; --muted:#4A6461; --line:#D2DEDA;
  --accent:#46620A; --accent-soft:#EAF4CC; --lime:#D9FF43; --on-lime:#0B1408;
  --good:#1E7F48; --good-soft:#DDF1E4; --bad:#BC3328; --bad-soft:#F8E0DD; --warn:#9A6410; --warn-soft:#F7EBD2;
  --chrome:#071A1D; --chrome-2:#0D272B; --chrome-ink:#F3F6F6; --chrome-muted:#9EB4B6; --chrome-line:#174147;
  --totem:#071A1D; --totem-fg:#F2C94C; --map:#E3EAE7; --road:#FFFFFF; --road-2:#C9D3CF; --water:#C8DDE3;
  --f-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071A1D; --surface:#0D272B; --surface-2:#113238; --ink:#F3F6F6; --muted:#9EB4B6; --line:#174147;
  --accent:#D9FF43; --accent-soft:#1E3A16; --lime:#D9FF43; --on-lime:#0B1408;
  --good:#38C985; --good-soft:#123A2C; --bad:#EF6A5E; --bad-soft:#3D1D1A; --warn:#F2C94C; --warn-soft:#3A3116;
  --chrome:#051416; --chrome-2:#0D272B; --chrome-ink:#F3F6F6; --chrome-muted:#9EB4B6; --chrome-line:#174147;
  --totem:#031012; --totem-fg:#F2C94C; --map:#0B2226; --road:#1B444A; --road-2:#123236; --water:#0E3340;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071A1D; --surface:#0D272B; --surface-2:#113238; --ink:#F3F6F6; --muted:#9EB4B6; --line:#174147;
  --accent:#D9FF43; --accent-soft:#1E3A16; --lime:#D9FF43; --on-lime:#0B1408;
  --good:#38C985; --good-soft:#123A2C; --bad:#EF6A5E; --bad-soft:#3D1D1A; --warn:#F2C94C; --warn-soft:#3A3116;
  --chrome:#051416; --chrome-2:#0D272B; --chrome-ink:#F3F6F6; --chrome-muted:#9EB4B6; --chrome-line:#174147;
  --totem:#031012; --totem-fg:#F2C94C; --map:#0B2226; --road:#1B444A; --road-2:#123236; --water:#0E3340;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num,table td.n{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.05}
h2{font-size:21px}
h3{font-size:17px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--chrome);color:var(--chrome-ink);border-right:1px solid var(--chrome-line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand{flex-direction:column;align-items:flex-start;gap:8px;text-decoration:none;color:var(--chrome-ink)}
.brand img{height:44px;width:auto;display:block}
.brand b{font-family:var(--f-display);font-size:16px;font-weight:600;display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--chrome-muted)}
.ws{display:grid;grid-template-columns:1fr 1fr;background:var(--chrome-2);border:1px solid var(--chrome-line);border-radius:9px;padding:3px;gap:3px}
.ws button{border:0;background:transparent;border-radius:6px;padding:7px 4px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--chrome-muted)}
.ws button[aria-pressed="true"]{background:var(--lime);color:var(--on-lime)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--chrome-ink);font-weight:500}
.nav a:hover{background:var(--chrome-2)}
.nav a[aria-current="page"]{background:rgba(217,255,67,.12);color:var(--lime);font-weight:600}
.side .eyebrow{color:var(--chrome-muted)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px;font-weight:700}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--chrome-muted);padding:0 6px;display:grid;gap:6px}
.proto{display:inline-flex;align-items:center;gap:6px;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;width:max-content}
main{min-width:0;padding-block:24px 48px;padding-inline:28px}
.topbar{display:none}
.bottom{display:none}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--chrome);color:var(--chrome-ink);border-bottom:1px solid var(--chrome-line);padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .topbar .ws{width:210px}
  .topbar .brand img{height:30px}
  main{padding-inline:16px;padding-block:18px 96px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--chrome);border-top:1px solid var(--chrome-line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  .bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;text-decoration:none;color:var(--chrome-muted);padding:4px 0;font-weight:500;position:relative}
  .bottom a[aria-current="page"]{color:var(--lime);font-weight:700}
  .bottom svg{width:21px;height:21px}
  .bottom .dot{position:absolute;top:2px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--bad)}
}

/* building blocks */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.head .sub{color:var(--muted);margin-top:4px;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel > h3 + *{margin-top:10px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;min-width:0;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;margin-top:2px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.up{color:var(--bad)} .down{color:var(--good)}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 30px 8px 10px;font-weight:600;max-width:100%}
.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--lime);color:var(--on-lime)}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:7px 12px;font-weight:600;font-size:13px}

/* totem price */
.totem{display:inline-flex;align-items:baseline;gap:2px;background:var(--totem);color:var(--totem-fg);font-family:var(--f-display);font-weight:600;border-radius:6px;padding:2px 8px;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:.02em;white-space:nowrap}
.totem small{font-size:.62em;opacity:.75;margin-right:2px}
.totem sup{font-size:.55em;top:-.6em}
.totem.lg{font-size:38px;padding:4px 14px;border-radius:8px}
.totem.md{font-size:22px}
.totem.sm{font-size:16px;padding:1px 6px}
.plain sup{font-size:.6em}

/* tables */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.station b{display:block;font-weight:600}
.station span{font-size:12px;color:var(--muted)}
.own-row td{background:var(--accent-soft)}

tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
a.rowlink{color:inherit;text-decoration:none}
a.rowlink b::after{content:" ›";color:var(--muted);font-weight:400}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;text-decoration:none;color:var(--accent);margin-bottom:8px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.hub{display:grid;gap:12px}
.hub .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{display:grid;gap:4px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);transition:border-color .15s}
.tile:hover{border-color:var(--accent)}
.tile .ic{display:flex;align-items:center;gap:8px;font-weight:600}
.tile .ic svg{width:18px;height:18px;color:var(--accent)}
.tile .big{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted);font-size:12px}
.tour{display:grid;gap:0;counter-reset:t}
.tour a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.tour a:last-child{border-bottom:0}
.tour a:hover b{text-decoration:underline}
.tour a::before{counter-increment:t;content:counter(t);width:26px;height:26px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-weight:700;font-size:13px}
.tour small{display:block;color:var(--muted);font-size:12.5px}
.hero-band{background:var(--chrome);color:var(--chrome-ink);border-radius:14px;padding:22px;display:grid;gap:8px;position:relative;overflow:hidden}
.hero-band h1{font-size:32px}
.hero-band p{color:var(--chrome-muted);max-width:60ch;margin:0}
.hero-band .eyebrow{color:var(--lime)}
.hero-band .line{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--lime),#F2C94C 60%,transparent)}
/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;border-radius:7px;padding:7px 9px;white-space:nowrap;transform:translate(-50%,-100%);z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tip b{font-weight:700}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;font-style:normal}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.band{height:10px;opacity:.5}

/* alerts */
.alert{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 0;overflow:hidden}
.alert .stripe{align-self:stretch;margin:-12px 0}
.alert.sev-bad .stripe{background:var(--bad)} .alert.sev-warn .stripe{background:var(--warn)} .alert.sev-info .stripe{background:var(--accent)}
.alert.ack{opacity:.55}
.alert .t{font-weight:600}
.alert .m{font-size:12.5px;color:var(--muted);margin-top:2px}

/* collection */
.collect{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.collect{grid-template-columns:minmax(0,1fr)}}
.step{display:grid;gap:10px}
.step + .step{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.step-h{display:flex;align-items:center;gap:10px;font-weight:700}
.step-h .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12px;flex:none}
.step-h .n.done{background:var(--good);color:#fff}
.comp-pick{display:grid;gap:6px}
.comp-pick button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;cursor:pointer}
.comp-pick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.comp-pick small{color:var(--muted);font-size:12px}
.photo{border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;padding:22px 14px;cursor:pointer;background:var(--surface-2);gap:4px}
.photo:hover{border-color:var(--accent)}
.photo img{max-height:180px;border-radius:8px}
.photo input{position:absolute;width:1px;height:1px;opacity:0}
.prices{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center}
.prow label b{display:block;font-weight:600}
.prow label small{color:var(--muted);font-size:12px}
.prow input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;text-align:right;font-family:var(--f-display);font-size:20px;font-weight:600;width:100%;font-variant-numeric:tabular-nums}
.prow input.flag{border-color:var(--warn);background:var(--warn-soft)}
.prow .hint{grid-column:1/-1;font-size:12px;color:var(--warn);margin-top:-4px}
.auto{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.auto b{color:var(--ink);font-weight:600}
.round{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px;gap:4px 8px;align-items:center;font-size:13px}
.round .h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tick{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:700;justify-self:center}
.tick.ok{background:var(--good-soft);color:var(--good)} .tick.no{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)} .tick.late{background:var(--bad-soft);color:var(--bad)}
.feed{display:grid;gap:8px}
.feed .it{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.feed .it img,.feed .it .ph{width:56px;height:56px;border-radius:7px;object-fit:cover;display:block}
.feed .it b{font-weight:600}
.feed .it small{display:block;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (min-width:861px){.toast{bottom:28px}}

/* unit */
.unit-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:620px){.unit-hero{grid-template-columns:minmax(0,1fr)}}
.gapbox{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.gapbox .g{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ladder{display:grid;gap:4px;margin-top:4px}
.ladder .r{display:grid;grid-template-columns:minmax(0,140px) minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:12.5px}
.ladder .bar{height:22px;position:relative;background:var(--surface-2);border-radius:4px}
.ladder .bar i{position:absolute;top:3px;bottom:3px;width:3px;border-radius:2px;background:var(--muted)}

/* executive */
.ucard{display:grid;gap:12px}
.ucard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.comp-bar{height:10px;border-radius:5px;background:var(--surface-2);position:relative;overflow:visible;border:1px solid var(--line)}
.comp-bar span{position:absolute;inset:0 auto 0 0;border-radius:5px}
.comp-bar .meta{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.heat td{text-align:center}
.cell{display:inline-block;min-width:52px;border-radius:6px;padding:3px 6px;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}

/* map */
.map svg{display:block;width:100%;height:auto;border-radius:var(--r);background:var(--map)}
.map .lbl{font-size:11px;font-family:var(--f-body);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--map);stroke-width:3px}
.map .pin{cursor:pointer}
.map-side{display:grid;gap:10px;align-content:start}
.map-layout{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(240px,1fr);gap:16px}
@media (max-width:980px){.map-layout{grid-template-columns:minmax(0,1fr)}}

/* clusters */
.cl-layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1080px){.cl-layout{grid-template-columns:minmax(0,1fr)}}
.cl-list{display:grid;gap:8px}
.cl-list button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;align-items:center}
.cl-list button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cl-list b{font-weight:600}
.cl-list small{color:var(--muted);font-size:12px}
.mv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mv:last-child{border-bottom:0}
.tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;border-radius:5px;padding:3px 6px;white-space:nowrap;align-self:start}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}}
@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
</style>
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

const reais=c=>(c/100).toFixed(2).replace('.',',');
const priceTxt=c=>'R$ '+reais(c)+'9';
const totem=(c,size='sm')=>`<span class="totem ${size}"><small>R$</small>${reais(c)}<sup>9</sup></span>`;
const plain=c=>`<span class="plain num">R$ ${reais(c)}<sup>9</sup></span>`;
const cents=(d,sign=true)=>{const v=Math.round(d*10)/10;const s=(Number.isInteger(v)?String(Math.abs(v)):Math.abs(v).toFixed(1).replace('.',','));return (v>0&&sign?'+':v<0?'−':'')+s+' ¢'};
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const quant=(a,q)=>{const s=[...a].sort((x,y)=>x-y),p=(s.length-1)*q,b=Math.floor(p);return s[b]+(s[Math.min(b+1,s.length-1)]-s[b])*(p-b)};
const sd=a=>{const m=avg(a);return Math.sqrt(avg(a.map(x=>(x-m)**2)))};
function ago(h){if(h<1)return 'há '+Math.max(1,Math.round(h*60))+' min';if(h<24)return 'há '+Math.round(h)+' h';const d=Math.floor(h/24);return 'há '+d+(d>1?' dias':' dia')}
function clock(h){const t=new Date(TODAY.getTime()-h*3600e3);const hh=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');return h<NOW_H?'hoje '+hh:(h<NOW_H+24?'ontem '+hh:String(t.getDate()).padStart(2,'0')+'/'+String(t.getMonth()+1).padStart(2,'0')+' '+hh)}
const deltaPill=(d,goodWhenUp=false)=>{if(Math.abs(d)<0.5)return `<span class="pill neutral">0 ¢</span>`;const up=d>0;const cls=(up!==goodWhenUp)?(up?'bad':'good'):(up?'good':'bad');return `<span class="pill ${cls}">${up?'▲':'▼'} ${cents(Math.abs(d),false)}</span>`};

const MOVE={gas:{day:26,d:-6,fuels:['gc','ga']},dsl:{day:21,d:10,fuels:['s10','s500']}};
function makeSeries(off,lag){
  const out={};
  for(const f of FUELS){
    const grp=MOVE.gas.fuels.includes(f.id)?'gas':MOVE.dsl.fuels.includes(f.id)?'dsl':null;
    let idio=0;const arr=[];
    for(let d=0;d<DAYS;d++){
      if(R()<0.045) idio+= (R()<.5?-1:1)*ri(2,4);
      idio=Math.max(-6,Math.min(6,idio));
      let v=f.base+off+idio;
      if(grp){const m=MOVE[grp];if(d>=m.day+lag[grp])v+=m.d}
      if(f.id==='et') v+=Math.round(Math.sin((d+off)/6)*2);
      arr.push(v);
    }
    out[f.id]=arr;
  }
  return out;
}

// preço conhecido = último coletado
function obsDay(h){return h<=NOW_H?DAYS-1:DAYS-1-Math.ceil((h-NOW_H)/24)}
function known(c,f){return c.series[f][obsDay(c.hours)]}
function prevKnown(c,f){return c.series[f][obsDay(c.hours)-1]}
function unitStats(u,f,day=null){
  const ps=u.comps.map(c=>day==null?known(c,f):c.series[f][day]);
  const own=day==null?u.series[f][DAYS-1]:u.series[f][day];
  const med=median(ps);
  return {own,ps,min:Math.min(...ps),max:Math.max(...ps),avg:avg(ps),med,gapMed:own-med,gapMin:own-Math.min(...ps)};
}

// ---------- alertas ----------
let ALERTS=[];
function buildAlerts(){
  const keep=new Set(ALERTS.filter(a=>a.ack).map(a=>a.key));
  const out=[];
  for(const u of UNITS){
    for(const c of u.comps){
      if(c.hours>24) out.push({key:'st'+c.id,type:'sem',sev:'warn',h:c.hours-24,unit:u,comp:c,title:`${c.name} sem atualização`,msg:`${u.name}: última coleta ${clock(c.hours)} (${ago(c.hours)}). A mediana da unidade usa o último preço conhecido.`});
      for(const f of FUELS){
        const d=known(c,f.id)-prevKnown(c,f.id);
        if(c.hours<=24&&Math.abs(d)>=5) out.push({key:'v'+c.id+f.id,type:'var',sev:'bad',h:c.hours,unit:u,comp:c,fuel:f.id,title:`${c.name} ${d>0?'subiu':'baixou'} ${f.short} em ${cents(Math.abs(d),false)}`,msg:`${u.name}: de ${priceTxt(known(c,f.id)-d)} para ${priceTxt(known(c,f.id))}. Coleta ${clock(c.hours)}.`});
      }
    }
    for(const f of FUELS){
      const s=unitStats(u,f.id);
      if(s.gapMed>=5) out.push({key:'a'+u.id+f.id,type:'acima',sev:'warn',h:0.4,unit:u,fuel:f.id,title:`${u.name} acima da mediana em ${f.short}`,msg:`Seu preço ${priceTxt(s.own)} está ${cents(s.gapMed,false)} acima da mediana (${priceTxt(s.med)}) dos 5 concorrentes.`});
      if(s.gapMed<=-5) out.push({key:'b'+u.id+f.id,type:'abaixo',sev:'info',h:0.4,unit:u,fuel:f.id,title:`${u.name} abaixo da mediana em ${f.short}`,msg:`Seu preço ${priceTxt(s.own)} está ${cents(-s.gapMed,false)} abaixo da mediana (${priceTxt(s.med)}). Pode haver margem para ajuste.`});
    }
  }
  out.sort((a,b)=>a.h-b.h);
  out.forEach(a=>a.ack=keep.has(a.key));
  ALERTS=out;
}
buildAlerts();
const openAlerts=()=>ALERTS.filter(a=>!a.ack).length;

// ---------- gráficos ----------
const CH={};let chN=0;
function niceStep(range){const c=[1,2,5,10,20,25,50,100];return c.find(s=>range/s<=5)||100}
function lineChart({labels,series,band,height=230,fmt=v=>'R$ '+reais(v),xEvery}){
  const id='c'+(chN++);const W=640,H=height,pl=56,pr=58,pt=14,pb=28;
  const vals=[...series.flatMap(s=>s.values),...(band?[...band.lo,...band.hi]:[])];
  let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<4){lo-=2;hi+=2}
  const step=niceStep(hi-lo);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const n=labels.length,x=i=>pl+(W-pl-pr)*i/(n-1),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let g='';
  for(let v=lo;v<=hi+1e-9;v+=step)g+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pl-8}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
  const ev=xEvery||Math.ceil(n/6);
  for(let i=n-1;i>=0;i-=ev)g+=`<text class="axis" x="${x(i)}" y="${H-8}" text-anchor="${i===n-1?'end':'middle'}">${labels[i]}</text>`;
  if(band){const top=band.hi.map((v,i)=>`${x(i)},${y(v)}`).join(' '),bot=band.lo.map((v,i)=>`${x(i)},${y(v)}`).reverse().join(' ');g+=`<polygon points="${top} ${bot}" fill="${band.color}" opacity=".16"/>`}
  for(const s of series){g+=`<polyline fill="none" stroke="${s.color}" stroke-width="${s.w||2}" ${s.dash?`stroke-dasharray="${s.dash}"`:''} stroke-linejoin="round" points="${s.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}"/>`;
    if(s.end){const v=s.values[n-1];g+=`<circle cx="${x(n-1)}" cy="${y(v)}" r="4" fill="${s.color}"/><text class="axis" x="${x(n-1)+8}" y="${y(v)+4}" style="fill:${s.color};font-weight:700">${fmt(v)}</text>`}}
  g+=`<line data-cross x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/>`;
  CH[id]={labels,series,band,fmt,x,n,W,pl,pr};
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de linhas">${g}</svg><div class="tip" hidden></div></div>`;
}
document.addEventListener('pointermove',e=>{
  const el=e.target.closest&&e.target.closest('[data-chart]');
  document.querySelectorAll('[data-chart] .tip').forEach(t=>{if(!el||!el.contains(t)){t.hidden=true;const l=t.parentNode.querySelector('[data-cross]');if(l)l.setAttribute('opacity',0)}});
  if(!el)return;const c=CH[el.dataset.chart];if(!c)return;
  const svg=el.querySelector('svg'),r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*c.W;
  const i=Math.max(0,Math.min(c.n-1,Math.round((sx-c.pl)/(c.W-c.pl-c.pr)*(c.n-1))));
  const l=el.querySelector('[data-cross]');l.setAttribute('x1',c.x(i));l.setAttribute('x2',c.x(i));l.setAttribute('opacity',1);
  const t=el.querySelector('.tip');t.hidden=false;
  t.innerHTML=`<b>${c.labels[i]}</b><br>`+c.series.map(s=>`<i style="background:${s.color}"></i>${s.name}: ${c.fmt(s.values[i])}`).join('<br>')+(c.band&&c.band.name?`<br><span style="opacity:.7">${c.band.name}: ${c.fmt(c.band.lo[i])} a ${c.fmt(c.band.hi[i])}</span>`:'');
  t.style.left=Math.min(Math.max(c.x(i)/c.W*r.width,70),r.width-70)+'px';t.style.top='8px';
});
function spark(vals,color='var(--accent)',w=90,h=26){const lo=Math.min(...vals),hi=Math.max(...vals)||1,rg=hi-lo||1;const p=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-2-(v-lo)/rg*(h-4)).toFixed(1)}`).join(' ');return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="${color}" stroke-width="1.6" points="${p}"/></svg>`}

function go(r){if(location.hash.slice(1)!==r)location.hash=r;else route()}
function route(){const h=location.hash.slice(1);S.route=VIEWS[h]?h:'inicio';renderShell();const v=document.getElementById('view');v.innerHTML=VIEWS[S.route]();v.classList.remove('view');void v.offsetWidth;v.classList.add('view');window.scrollTo(0,0);try{localStorage.setItem('radar-route',S.route)}catch(e){}}
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{

VIEWS.unidade=()=>{

  const rows=[...u.comps.map(c=>({c,p:known(c,f),d:known(c,f)-prevKnown(c,f)})),{own:true,p:s.own,d:u.series[f][DAYS-1]-u.series[f][DAYS-2]}].sort((a,b)=>a.p-b.p);

  <div class="stack">

    </div>

      <div class="kpi"><div class="eyebrow">Mediana</div><div class="v">${plain(s.med)}</div><div class="d">5 concorrentes</div></div>

      <div class="kpi"><div class="eyebrow">Maior</div><div class="v">${plain(s.max)}</div><div class="d">${u.comps.find(c=>known(c,f)===s.max).name}</div></div>
      <div class="kpi"><div class="eyebrow">Média</div><div class="v">${plain(Math.round(s.avg))}</div><div class="d">Spread ${cents(s.max-s.min,false)}</div></div>
      <div class="kpi"><div class="eyebrow">Mediana 24 h</div><div class="v">${deltaPill(d24)}</div><div class="d">7 dias: ${cents(d7)}</div></div>
      <div class="kpi"><div class="eyebrow">Atualizados</div><div class="v">${fresh} de 5</div><div class="d">Última coleta ${clock(last)}</div></div>
    </div>
    <div class="grid2">
      <div class="panel"><h3>Histórico de 30 dias</h3>
        ${lineChart({labels:[...Array(DAYS)].map((_,i)=>dlabel(i)),band:{lo:hist.map(h=>h.min),hi:hist.map(h=>h.max),color:'var(--muted)',name:'Faixa da concorrência'},series:[{name:'Mediana',values:hist.map(h=>h.med),color:'var(--ink)',dash:'5 4',w:1.6},{name:'Menor',values:hist.map(h=>h.min),color:'var(--good)',w:1.4},{name:'Seu preço',values:hist.map(h=>h.own),color:'var(--accent)',w:2.6,end:true}]})}

        `<tr class="click" data-link="posto" data-p="${esc(JSON.stringify({unit:u.id,comp:r.c.id}))}"><td class="station"><a class="rowlink" ${lnk('posto',{unit:u.id,comp:r.c.id})}><b>${esc(r.c.name)}</b></a><span>${r.c.flag}</span></td><td class="n">${totem(r.p)}</td><td class="n">${cents(r.p-s.own)}</td><td class="n">${deltaPill(r.d)}</td><td>${r.c.hours>24?`<span class="pill warn">${ago(r.c.hours)}</span>`:`<span class="muted">${clock(r.c.hours)}</span>`}</td><td><img src="${r.c.img||photoThumb(r.c,u)}" alt="Foto do totem de ${esc(r.c.name)}" width="34" height="34" style="border-radius:5px;display:block;object-fit:cover"></td></tr>`).join('')}</tbody></table></div></div>
  </div>`;
};

          return `<div class="prow"><label for="p-${f.id}"><b>${f.name}</b><small>${last!=null?'Último: '+priceTxt(last):'Escolha o concorrente'}</small></label><input id="p-${f.id}" data-price="${f.id}" inputmode="decimal" placeholder="${last!=null?reais(last)+'9':'0,000'}" value="${esc(v)}" class="${flag?'flag':''}" autocomplete="off">${flag?`<div class="hint">Variação de ${cents(p-last)} sobre a última coleta. Confira o valor; ele será salvo com confiança baixa.</div>`:''}</div>`}).join('')}</div>

        ${u.comps.map(c=>`<span>${esc(c.name)}</span>${c.hours<=NOW_H?'<span class="tick ok">✓</span>':'<span class="tick late">!</span>'}${c.hours<=2.5?'<span class="tick ok">✓</span>':'<span class="tick no">·</span>'}`).join('')}</div>

function parsePrice(v){if(v==null||v==='')return null;const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));if(!isFinite(n)||n<=0)return null;return Math.floor(n*100+1e-6)}

function barsDaily(arr){const W=300,H=46,bw=W/arr.length;return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Coletas por dia, meta 9 de 10"><line x1="0" x2="${W}" y1="${H-H*.9}" y2="${H-H*.9}" stroke="var(--ink)" stroke-dasharray="2 3" opacity=".5"/>${arr.map((v,i)=>`<rect x="${i*bw+1}" y="${H-v/10*H}" width="${bw-2}" height="${v/10*H}" rx="1.5" fill="${v>=9?'var(--good)':v>=7?'var(--warn)':'var(--bad)'}"><title>${dlabel(i)}: ${v} de 10</title></rect>`).join('')}</svg>`}

VIEWS.mapa=()=>{

   <path d="M60 470 C120 360 200 330 300 300 S520 260 660 300" stroke="var(--road)" stroke-width="7" fill="none"/><path d="M0 330 L250 330" stroke="var(--road)" stroke-width="5" fill="none"/>
   <path d="M420 460 C440 380 400 330 460 300 S600 330 660 360 L660 460 Z" fill="var(--water)"/>

VIEWS.clusters=()=>{

  let strip=`<line x1="20" x2="${W-20}" y1="60" y2="60" stroke="var(--line)"/><rect x="${X(m.p25)}" y="40" width="${X(m.p75)-X(m.p25)}" height="40" rx="4" fill="var(--accent)" opacity=".15"/><line x1="${X(m.med)}" x2="${X(m.med)}" y1="34" y2="86" stroke="var(--ink)" stroke-width="2"/><text class="axis" x="${X(m.med)}" y="28" text-anchor="middle" style="font-weight:700;fill:var(--ink)">mediana ${reais(m.med)}</text>`;
  for(let v=lo;v<=hi;v+=5)strip+=`<text class="axis" x="${X(v)}" y="108" text-anchor="middle">${reais(v)}</text><line x1="${X(v)}" x2="${X(v)}" y1="88" y2="93" stroke="var(--line)"/>`;

    <div class="stack" style="min-width:0">
      <div class="panel"><div class="head" style="margin:0"><div><h2>${cl.name}</h2><div class="muted" style="font-size:12.5px">Raio de ${cl.radius} km · ${cl.n} postos · ${Math.round(m.fresh*100)}% atualizados em 24 h · confiança ${Math.round(m.conf*100)}%</div></div>${totem(m.med,'md')}</div></div>
      <div class="kpis">
        <div class="kpi"><div class="eyebrow">Mínimo</div><div class="v">${plain(m.min)}</div></div>
        <div class="kpi"><div class="eyebrow">P25</div><div class="v">${plain(Math.round(m.p25))}</div></div>

        <div class="kpi"><div class="eyebrow">P75</div><div class="v">${plain(Math.round(m.p75))}</div></div>
        <div class="kpi"><div class="eyebrow">Máximo</div><div class="v">${plain(m.max)}</div></div>
        <div class="kpi"><div class="eyebrow">Spread</div><div class="v num">${cents(m.max-m.min,false)}</div><div class="d">Desvio ${cents(m.sd,false)}</div></div>
        <div class="kpi"><div class="eyebrow">Mediana 24 h</div><div class="v">${deltaPill(m.d24)}</div></div>
        <div class="kpi"><div class="eyebrow">Mediana 7 dias</div><div class="v">${deltaPill(m.d7)}</div></div>
      </div>

VIEWS.postocp4=()=>{
  const cl=CLUSTERS.find(c=>c.id===S.cl)||CLUSTERS[0],s=cl.st[S.cst]||cl.st[0],p=s.series[DAYS-1];
  const profile=s.off<-3?'Agressivo':cl.mv==='UPWARD'&&s.lag===0?'Iniciador':s.lag>=3?'Seguidor lento':'Seguidor';
  const react=cl.mv==='UPWARD'?(s.lag===0?'Subiu primeiro na alta de 23/09':s.lag>=20?'Ainda não acompanhou a alta de 23/09':`Acompanhou a alta ${s.lag} dia${s.lag>1?'s':''} depois do primeiro`):'Sem movimento regional para medir reação';
  const r=rng(S.cst*31+cl.n);const tx=Math.round(r()*300+80),vol=Math.round(tx*r()*0.35+tx*0.25);
  return `<a class="back" ${lnk('clusters',{cl:cl.id})}>‹ ${cl.name}</a>
  <div class="head"><div><div class="eyebrow">Posto credenciado CP4</div><h1>${esc(s.name)}</h1><div class="sub">${s.brand} · cluster <a ${lnk('clusters',{cl:cl.id})}>${cl.name}</a> · fonte ${s.src}, atualizado ${ago(s.hours)}</div></div>${totem(p,'lg')}</div>
  <div class="stack">
    <div class="kpis">
      <div class="kpi"><div class="eyebrow">vs. mediana do cluster</div><div class="v">${cents(p-cl.m.med)}</div><div class="d">Mediana ${priceTxt(cl.m.med)}</div></div>
      <div class="kpi"><div class="eyebrow">Perfil (preliminar)</div><div class="v" style="font-size:20px">${profile}</div><div class="d">${react}</div></div>
      <div class="kpi"><div class="eyebrow">Transações CP4 · 7 dias</div><div class="v">${tx}</div><div class="d">${vol} mil litros</div></div>
      <div class="kpi"><div class="eyebrow">Confiança do preço</div><div class="v">${s.src==='CP4 Core'?'95%':'70%'}</div><div class="d">${s.src==='CP4 Core'?'Preço pago em transação':'Levantamento ANP semanal'}</div></div>
    </div>
    <div class="panel"><h3>Diesel S10 em 30 dias contra o cluster</h3>
      ${lineChart({labels:[...Array(DAYS)].map((_,i)=>dlabel(i)),band:{lo:cl.p25S,hi:cl.p75S,color:'var(--accent)',name:'P25–P75 do cluster'},series:[{name:'Mediana do cluster',values:cl.medS,color:'var(--muted)',dash:'5 4',w:1.4},{name:s.name,values:s.series,color:'var(--bad)',w:2.6,end:true}]})}
      <div class="legend"><span><i style="background:var(--bad)"></i>${esc(s.name)}</span><span><i style="background:var(--muted)"></i>Mediana do cluster</span><span><i class="band" style="background:var(--accent)"></i>Faixa P25–P75</span></div>
    </div>
    <div class="muted" style="font-size:12px">Perfis comportamentais e liderança de preço entram na Fase 5, depois de semanas de histórico. Aqui são uma prévia.</div>
  </div>`;
};

// ---------- interações ----------
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-unitgo],a');if(!t)return;
  const d=t.dataset;
  if(d.fuel){S.fuel=d.fuel;route()}
  else if(d.mfuel){S.mapFuel=d.mfuel;route()}
  else if(d.af){S.alertF=d.af;route()}
  else if(d.ack){const a=ALERTS.find(x=>x.key===d.ack);a.ack=!a.ack;route()}
  else if(d.cl){S.cl=d.cl;route();if(innerWidth<1080)document.querySelector('.cl-layout .stack').scrollIntoView({behavior:'smooth'})}
  else if(d.reg){S.regions.has(d.reg)?S.regions.delete(d.reg):S.regions.add(d.reg);route()}
  else if(d.ccomp){S.collect.comp=d.ccomp;S.collect.prices={};route()}
  else if(d.cell){const [u,f]=d.cell.split('|');S.unit=u;S.fuel=f;go('unidade')}
  else if(d.unitgo){e.preventDefault();S.unit=d.unitgo;go('unidade')}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.matches('[data-unit]')){S.unit=t.value;route()}
  if(t.matches('[data-cunit]')){S.collect={unit:t.value,comp:null,photo:null,prices:{}};route()}
  if(t.id==='photo-in'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{S.collect.photo=r.result;route()};r.readAsDataURL(t.files[0])}
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t.matches('[data-price]'))return;
  S.collect.prices[t.dataset.price]=t.value;
  // re-render preservando o foco
  const id=t.id,pos=t.selectionStart;route();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='collect-form')return;e.preventDefault();
  const C=S.collect,u=unitById(C.unit),c=u.comps.find(x=>x.id===C.comp);if(!c||!C.photo)return;
  let n=0,low=false;
  for(const f of FUELS){const p=parsePrice(C.prices[f.id]);if(p==null)continue;const last=known(c,f.id);if(Math.abs(p-last)>=30)low=true;
    // evento imutável: o histórico do dia anterior fica como estava, o dia de hoje recebe o novo preço
    c.series[f.id][DAYS-1]=p;n++}
  if(c.hours>NOW_H){const od=obsDay(c.hours);for(const f of FUELS)for(let d=od+1;d<DAYS-1;d++)c.series[f.id][d]=c.series[f.id][od]}
  if(c.hours<=NOW_H&&c.hours>2.5)u.done[DAYS-1]++;else if(c.hours>NOW_H)u.done[DAYS-1]++;
  c.hours=0.01;c.img=C.photo;
  FEED.unshift({u,c,h:0.01,n,user:u.user,conf:low?'baixa':'alta',img:C.photo});
  buildAlerts();
  S.collect={unit:C.unit,comp:null,photo:null,prices:{}};
  route();window.scrollTo({top:0,behavior:'smooth'});
  toast(`Coleta salva: ${n} preço${n>1?'s':''} de ${c.name}${low?' (confiança baixa)':''}`);
});

// ---------- início ----------
(function(){let r=location.hash.slice(1);if(!r){try{r=localStorage.getItem('radar-route')||''}catch(e){}}
  if(r&&VIEWS[r]&&r!==location.hash.slice(1)){history.replaceState(null,'','#'+r)}route()})();
</script>
